included:
  - Sources
  - Tests

excluded:
  - .build
  - .cocoindex_code
  - Package.swift

opt_in_rules:
  - sorted_imports

function_body_length:
  warning: 40
  error: 80

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 700

cyclomatic_complexity:
  warning: 10
  error: 15

function_parameter_count:
  warning: 5
  error: 8
